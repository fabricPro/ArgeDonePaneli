<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f7f8">
    <title>Giriş — FAS Kumaş Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    {# Tam Stüdyo — main.css YÜKLENMEZ (saf yeni dil) #}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body class="studio login-page">
    <form class="login-card" method="POST"
          action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
        <svg class="login-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="3" y="4" width="8" height="3.4" rx="1.2"/>
            <rect x="13.6" y="3" width="3.4" height="8" rx="1.2"/>
            <rect x="7" y="13" width="3.4" height="8" rx="1.2"/>
            <rect x="13" y="16.6" width="8" height="3.4" rx="1.2"/>
        </svg>
        <div class="login-brand">FAS</div>
        <div class="login-sub">Kumaş Küratörlük Paneli</div>
        <input type="password" name="password" placeholder="Şifre" autofocus required class="field" autocomplete="current-password">
        {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
        <button type="submit" class="btn btn-primary">Giriş</button>
    </form>
</body>
</html>
