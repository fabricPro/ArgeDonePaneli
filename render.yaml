services:
  - type: web
    name: mobidik-kumas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir web app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true        # Render otomatik uretir
      - key: SUPABASE_URL
        sync: false                # Dashboard'dan elle gir
      - key: SUPABASE_SERVICE_KEY
        sync: false                # Dashboard'dan elle gir (gizli!)
      - key: APP_PASSWORD
        sync: false                # Dashboard'dan elle gir (panel sifresi)
      - key: MOBIDIK_API_TOKEN
        sync: false                # Dashboard'dan elle gir (eklenti yakalama token'i — Sprint 9)
