<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaee; --muted:#9aa3b2; --accent:#c9a86a; --border:#262a33; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:24px 32px;border-bottom:1px solid var(--border);}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:0.3px}
  .sub{color:var(--muted);font-size:13px}
  .stats{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .stats b{color:var(--text);font-variant-numeric:tabular-nums}
  .filters{display:flex;gap:12px;flex-wrap:wrap;padding:16px 32px;border-bottom:1px solid var(--border);background:#11141a;}
  .filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .filters select,.filters input{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;min-width:160px}
  .count{margin-left:auto;align-self:flex-end;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .count b{color:var(--text)}
  main{padding:24px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .group-header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 6px;color:var(--accent);font-size:13px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);margin-top:4px}
  .group-header:first-child{margin-top:0;padding-top:0}
  .group-meta{color:var(--muted);font-size:11px;letter-spacing:0.5px;text-transform:none;font-variant-numeric:tabular-nums}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .thumb{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#23272f;border:0}
  .thumb-fallback{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:8px;background:#23272f;aspect-ratio:1/1}
  .body{padding:12px 14px}
  .brand{color:var(--accent);font-size:11px;letter-spacing:1px;text-transform:uppercase}
  .name{font-size:14px;margin:2px 0 6px;line-height:1.3}
  .meta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#222630;border:1px solid var(--border);border-radius:4px;padding:1px 6px}
  .chip-flag{background:#1a2330;border-color:#2a3a4f;color:#9fc1e8}
  .chip-colors{background:#2a2330;border-color:#4a3a2a;color:#e8c89f}
  .mini-swatches{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}
  .mini-swatches span{width:14px;height:14px;border-radius:50%;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.1)}
  .empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .modal.open{display:flex}
  .modal-inner{background:var(--card);border:1px solid var(--border);border-radius:12px;max-width:1100px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative}
  .close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer}
  .active-color-bar{margin:10px 0 4px;padding:8px 10px;background:#1c2029;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
  .active-color-bar b{color:var(--text)}
  .active-color-bar .acb-swatch{width:24px;height:24px;border-radius:50%;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.15)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:6px 0 14px}
  .gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;transition:transform .15s}
  .gallery img:hover{transform:scale(1.03);border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
  td,th{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:500;width:34%}
  .color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .color-item{display:flex;align-items:center;gap:10px;background:#1e2229;border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;transition:border-color .15s,background .15s}
  .color-item:hover{border-color:var(--accent);background:#23282f}
  .color-item.active{border-color:var(--accent);background:#2a2530;box-shadow:inset 0 0 0 1px var(--accent)}
  .color-swatch{width:30px;height:30px;border-radius:50%;background:#2a2e35 center/cover no-repeat;border:1px solid rgba(255,255,255,.1);flex-shrink:0}
  .color-meta{display:flex;flex-direction:column;font-size:11px;line-height:1.3;min-width:0}
  .color-name{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .color-code{color:var(--muted);font-variant-numeric:tabular-nums}
  .mobidik{background:#1d2129;border-left:3px solid var(--accent);padding:12px 14px;border-radius:6px;margin-top:14px;font-size:13px;line-height:1.5}
  .mobidik h4{margin:0 0 6px;color:var(--accent);font-size:12px;letter-spacing:1px;text-transform:uppercase}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;user-select:none;overflow:hidden}
  .lightbox.open{display:flex}
  .lightbox img{max-width:96vw;max-height:92vh;object-fit:contain;box-shadow:0 6px 40px rgba(0,0,0,.6);border-radius:4px;transform-origin:center center;transition:transform .15s;will-change:transform;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
  .lightbox.zoomed img{cursor:grab}
  .lightbox.dragging img{cursor:grabbing;transition:none}
  .lb-btn{position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;z-index:2}
  .lb-btn:hover{background:rgba(255,255,255,.18);border-color:var(--accent)}
  .lb-nav{top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;font-size:30px;line-height:1}
  .lb-prev{left:24px} .lb-next{right:24px}
  .lb-close{top:20px;right:24px;width:42px;height:42px;border-radius:50%;font-size:22px;line-height:1}
  .lb-open-tab{top:20px;right:80px;height:42px;padding:0 16px;border-radius:21px;font-size:12px;letter-spacing:0.4px;text-transform:uppercase;text-decoration:none}
  .lb-counter{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:20px;z-index:2}
  .lb-hint{position:absolute;bottom:24px;right:24px;color:#fff;font-size:11px;background:rgba(0,0,0,.5);padding:5px 12px;border-radius:14px;letter-spacing:0.3px;opacity:.7;pointer-events:none;z-index:2}
  .lb-zoom-pct{position:absolute;bottom:24px;left:24px;color:#fff;font-size:11px;background:rgba(0,0,0,.5);padding:5px 12px;border-radius:14px;letter-spacing:0.3px;font-variant-numeric:tabular-nums;display:none;z-index:2}
  .lightbox.zoomed .lb-zoom-pct{display:block}
</style>

function unique(a){return [...new Set(a.filter(Boolean))].sort()}
function pop(id,vals){const s=document.getElementById(id);vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})}
function widthBucket(w){if(!w)return null;const n=parseInt(w);if(isNaN(n))return null;if(n<150)return '<150';if(n<280)return '150-280';if(n<320)return '280-320';return '>320'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function colorsOf(p){return Array.isArray(p.renkler)?p.renkler:[]}
function colorTotal(arr){return arr.reduce((s,p)=>s+colorsOf(p).length,0)}
function imgTotal(arr){return arr.reduce((s,p)=>s+colorsOf(p).reduce((t,c)=>t+(c.gorseller?.length||0),0),0)}

// Fallback chain: local -> CDN (gerçek görsel) -> swatch (renk örneği) -> "Görsel yok" placeholder.
function attachImgFallback(img, localPath, swatchUrl){
  img.dataset.local=localPath||'';
  img.dataset.cdn=cdnFallback[localPath]||'';
  img.dataset.swatch=swatchUrl||'';
  img.dataset.stage='0';
  img.onerror=function(){
    if(this.dataset.stage==='0' && this.dataset.cdn){
      this.dataset.stage='1'; this.src=this.dataset.cdn; return;
    }
    if(this.dataset.stage!=='2' && this.dataset.swatch){
      this.dataset.stage='2'; this.src=this.dataset.swatch; return;
    }
    const d=document.createElement('div');
    d.className='thumb-fallback';
    d.innerHTML='Görsel yüklenemedi';
    this.replaceWith(d);
  };
}

function buildHeaderStats(){
  const c = unique(products.map(p=>p.ulke));
  const total = colorTotal(products);
  const imgs = imgTotal(products);
  const parts=[];
  parts.push('<span><b>'+products.length+'</b> ürün</span>');
  parts.push('<span><b>'+total+'</b> renk varyantı</span>');
  parts.push('<span><b>'+imgs+'</b> kumaş görseli</span>');
  c.forEach(country=>{
    const items=products.filter(p=>p.ulke===country);
    parts.push('<span><b>'+items.length+'</b> '+country+' <span style="opacity:.6">('+colorTotal(items)+' renk)</span></span>');
  });
  document.getElementById('stats').innerHTML=parts.join(' · ');
}

function render(){
  const fcountry=document.getElementById('f-country').value;
  const fb=document.getElementById('f-brand').value;
  const fc=document.getElementById('f-comp').value;
  const fw=document.getElementById('f-width').value;
  const fv=document.getElementById('f-weave').value;
  const fq=document.getElementById('f-q').value.toLowerCase();
  const g=document.getElementById('grid');g.innerHTML='';
  const list=products.filter(p=>
    (!fcountry||p.ulke===fcountry)&&(!fb||p.marka===fb)&&
    (!fc||(p.kompozisyon||'').includes(fc))&&(!fw||widthBucket(p.en)===fw)&&
    (!fv||p.dokuma===fv)&&(!fq||(p.urun_kodu+' '+p.urun_adi).toLowerCase().includes(fq))
  );
  document.getElementById('count').innerHTML='<b>'+list.length+'</b> ürün · <b>'+colorTotal(list)+'</b> renk';
  if(!list.length){g.innerHTML='<div class="empty">Filtreyle eşleşen ürün yok.</div>';return}

  const grouped={};
  list.forEach(p=>{const u=p.ulke||'Belirsiz';(grouped[u]=grouped[u]||[]).push(p)});
  Object.keys(grouped).sort().forEach(country=>{
    const items=grouped[country];
    const h=document.createElement('div');h.className='group-header';
    h.innerHTML='<span>'+esc(country)+'</span><span class="group-meta">'+items.length+' ürün · '+colorTotal(items)+' renk varyantı</span>';
    g.appendChild(h);
    items.forEach(p=>{
      const c=document.createElement('div');c.className='card';c.onclick=()=>openModal(p);
      const cls=colorsOf(p);
      const firstColor=cls[0]||{};
      const firstImg=(firstColor.gorseller&&firstColor.gorseller[0])||'';
      const img=document.createElement('img');
      img.className='thumb';img.src=firstImg;img.alt=p.urun_adi||'';img.loading='lazy';
      attachImgFallback(img, firstImg, firstColor.swatch||'');
      c.appendChild(img);
      const body=document.createElement('div');body.className='body';
      const miniSwatches=cls.slice(0,8).map(r=>'<span style="background-image:url('+esc(r.swatch)+')" title="'+esc(r.ad||r.kod)+'"></span>').join('')+(cls.length>8?'<span style="background:#222;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:9px;border:none;width:auto;padding:0 4px;border-radius:7px">+'+(cls.length-8)+'</span>':'');
      body.innerHTML='<div class="brand">'+esc(p.marka)+'</div><div class="name">'+esc(p.urun_adi||p.urun_kodu)+'</div><div class="meta"><span class="chip">'+esc(p.urun_kodu)+'</span>'+(p.en?'<span class="chip">'+esc(p.en)+' cm</span>':'')+(p.dokuma?'<span class="chip">'+esc(p.dokuma)+'</span>':'')+(p.ulke?'<span class="chip chip-flag">'+esc(p.ulke)+'</span>':'')+'<span class="chip chip-colors">'+cls.length+' renk</span></div><div class="mini-swatches">'+miniSwatches+'</div>';
      c.appendChild(body);
      g.appendChild(c);
    });
  });
}

// Lightbox
let lbIndex=0, lbScale=1, lbTx=0, lbTy=0, lbDragging=false, lbStartX=0, lbStartY=0;
function applyTransform(){
  const img=document.getElementById('lb-img');
  img.style.transform='translate('+lbTx+'px,'+lbTy+'px) scale('+lbScale+')';
  document.getElementById('lightbox').classList.toggle('zoomed',lbScale>1);
  document.getElementById('lb-zoom-pct').textContent=Math.round(lbScale*100)+'%';
}
function resetZoom(){lbScale=1;lbTx=0;lbTy=0;applyTransform()}
function openLightbox(idx){if(!currentGallery.length)return;lbIndex=idx;updateLb();document.getElementById('lightbox').classList.add('open')}
function updateLb(){
  const src=currentGallery[lbIndex];
  const cdn=cdnFallback[src]||'';
  const lbImg=document.getElementById('lb-img');
  lbImg.dataset.stage='0';
  lbImg.dataset.cdn=cdn;
  lbImg.onerror=function(){
    if(this.dataset.stage==='0' && this.dataset.cdn){
      this.dataset.stage='1'; this.src=this.dataset.cdn;
    } else {
      this.alt='Görsel yüklenemedi — indir.ps1 çalıştırılması gerek';
      this.style.opacity='.4';
    }
  };
  lbImg.style.opacity='1';
  lbImg.src=src;
  document.getElementById('lb-open-tab').href=cdn||src;
  const c=document.getElementById('lb-counter');
  const many=currentGallery.length>1;
  c.textContent=(lbIndex+1)+' / '+currentGallery.length;
  c.style.display=many?'':'none';
  document.querySelector('.lb-prev').style.display=many?'':'none';
  document.querySelector('.lb-next').style.display=many?'':'none';
  resetZoom();
}
function lbPrev(e){if(e)e.stopPropagation();lbIndex=(lbIndex-1+currentGallery.length)%currentGallery.length;updateLb()}
function lbNext(e){if(e)e.stopPropagation();lbIndex=(lbIndex+1)%currentGallery.length;updateLb()}
function closeLightbox(e){if(e)e.stopPropagation();document.getElementById('lightbox').classList.remove('open');resetZoom()}
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLightbox()});
document.getElementById('lightbox').addEventListener('wheel',function(e){
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  e.preventDefault();
  const delta=e.deltaY<0?1.18:1/1.18;
  const newScale=Math.max(1,Math.min(6,lbScale*delta));
  if(newScale===lbScale)return;
  const img=document.getElementById('lb-img');
  const rect=img.getBoundingClientRect();
  const cx=e.clientX-(rect.left+rect.width/2);
  const cy=e.clientY-(rect.top+rect.height/2);
  const ratio=newScale/lbScale-1;
  lbTx-=cx*ratio;lbTy-=cy*ratio;
  lbScale=newScale;
  if(lbScale<=1.01){lbScale=1;lbTx=0;lbTy=0}
  applyTransform();
},{passive:false});
document.getElementById('lb-img').addEventListener('dblclick',function(e){
  e.stopPropagation();
  if(lbScale>1){resetZoom();return}
  const newScale=2.5;
  const img=this;
  const rect=img.getBoundingClientRect();
  const cx=e.clientX-(rect.left+rect.width/2);
  const cy=e.clientY-(rect.top+rect.height/2);
  const ratio=newScale-1;
  lbTx=-cx*ratio;lbTy=-cy*ratio;
  lbScale=newScale;
  applyTransform();
});
document.getElementById('lb-img').addEventListener('mousedown',function(e){
  if(lbScale<=1)return;
  e.preventDefault();e.stopPropagation();
  lbDragging=true;lbStartX=e.clientX-lbTx;lbStartY=e.clientY-lbTy;
  this.style.cursor='grabbing';
});
document.addEventListener('mousemove',function(e){
  if(!lbDragging)return;
  lbTx=e.clientX-lbStartX;lbTy=e.clientY-lbStartY;
  applyTransform();
});
document.addEventListener('mouseup',function(){
  if(!lbDragging)return;
  lbDragging=false;
  const img=document.getElementById('lb-img');
  if(img)img.style.cursor=lbScale>1?'grab':'';
});
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLightbox();
  else if(e.key==='ArrowLeft')lbPrev();
  else if(e.key==='ArrowRight')lbNext();
  else if(e.key==='0'||e.key==='r'||e.key==='R')resetZoom();
});

// Filter setup
function populateFilters(){
  pop('f-country', unique(products.map(p=>p.ulke)));
  pop('f-brand', unique(products.map(p=>p.marka)));
  const comps=new Set();
  products.forEach(p=>{
    const s=p.kompozisyon||'';
    ['Cotton','Polyester','Flax','Linen','Wool','Viscose','Acrylic','Lyocell','Alpaca'].forEach(k=>{ if(s.includes(k))comps.add(k); });
  });
  pop('f-comp', [...comps].sort());
    pop('f-width', ['<150','150-280','280-320','>320']);
  pop('f-weave', unique(products.map(p=>p.dokuma)));
  ['f-country','f-brand','f-comp','f-width','f-weave','f-q'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener(id==='f-q'?'input':'change',render);
  });
}

buildHeaderStats();
populateFilters();
render();
</script>
